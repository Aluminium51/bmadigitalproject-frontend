services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Browser requests must use the backend host URL; /api/v1 is not proxied by Next.js.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://172.27.15.59:8081/api/v1}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://172.27.15.59:8081}
        NEXT_PUBLIC_FILE_PREVIEW_URL: ${NEXT_PUBLIC_FILE_PREVIEW_URL:-http://localhost:8081/api/v1}
    container_name: bma_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://172.27.15.59:8081/api/v1}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://172.27.15.59:8081}
      - NEXT_PUBLIC_FILE_PREVIEW_URL=${NEXT_PUBLIC_FILE_PREVIEW_URL:-http://localhost:8081/api/v1}
      # These Compose files use separate networks by default. Override this
      # with http://backend:8081 only when both services share a Docker network.
      - BACKEND_URL=${BACKEND_URL:-http://172.27.15.59:8081}
    # จำกัดทรัพยากร (Optional: ป้องกันไม่ให้ Next.js กินแรมเซิร์ฟเวอร์จนหมด)
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
